<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cheema AI (Beta)</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff66;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.app {
  width: 95%;
  max-width: 520px;
  border: 2px solid #00ff66;
  padding: 12px;
  display: flex;
  flex-direction: column;
}

.chat {
  flex: 1;
  overflow-y: auto;
  margin: 10px 0;
  border-top: 1px solid #00ff66;
  border-bottom: 1px solid #00ff66;
  padding: 8px;
}

.bot { color: #00ff66; margin-bottom: 8px; white-space: pre-line; }
.user { color: #ff4444; text-align: right; margin-bottom: 8px; }

.input-row {
  display: flex;
  gap: 6px;
}

input {
  flex: 1;
  padding: 8px;
  background: black;
  color: white;
  border: 1px solid #00ff66;
}

button {
  padding: 8px 12px;
  background: #00ff66;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.preview {
  margin-top: 10px;
  border: 2px dashed #00aaff;
  height: 140px;
  display: none;
  align-items: center;
  justify-content: center;
  color: #00aaff;
  font-size: 13px;
  text-align: center;
}
</style>
</head>

<body>
<div class="app">
  <h2 style="text-align:center">🦜 Cheema AI<br><small>DIY + Scan Preview (Beta)</small></h2>

  <div class="chat" id="chat">
    <div class="bot">
Hey! I’m Cheema 🦜  
I can:
• Answer questions  
• Design DIY blueprints  
• Tell you where to buy parts  
• Help you scan a space  

Try: "Build a desk" or "Scan my room"
    </div>
  </div>

  <div class="input-row">
    <input id="userInput" placeholder="Ask Cheema..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <div id="preview" class="preview">
🟦 Build Preview Area  
(Minecraft-style placement preview)
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
</div>

<script>
function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const msg = input.value.trim();
  if (!msg) return;

  addMessage(msg, "user");
  input.value = "";

  const lower = msg.toLowerCase();

  // Scan request
  if (lower.includes("scan")) {
    addMessage(
"📸 Scan Mode\nUse your phone camera to scan the area.\nThis helps preview how the build fits.\nTap the camera when ready.",
      "bot"
    );
    document.getElementById("cameraInput").click();
    return;
  }

  // Blueprint logic
  if (lower.includes("build") || lower.includes("blueprint")) {
    addMessage(
`🧱 DIY BLUEPRINT (ROOM-SAFE)

Tools:
• Drill
• Screwdriver
• Measuring tape
• Saw (hand saw)

Materials:
• Wood boards
• Screws
• Wood glue

Versions:
• Cheap: Pine wood
• Standard: Birch
• Premium: Oak

Buy parts at:
• Home Depot
• Lowe's
• Local hardware store

Want to scan your room for fit?`,
      "bot"
    );
    return;
  }

  // General help
  addMessage(
"I can help with DIY builds, planning, safety, or scanning a space. Just ask 🦜",
    "bot"
  );
}

// Fake scan preview
document.getElementById("cameraInput").addEventListener("change", () => {
  const preview = document.getElementById("preview");
  preview.style.display = "flex";
  addMessage(
"🟦 Preview loaded!\nThis blue outline shows where your build could go.\n
