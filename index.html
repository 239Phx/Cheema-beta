<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cheema AI (Beta)</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff66;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 90%;
      max-width: 500px;
      border: 2px solid #00ff66;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid #00ff66;
      padding-bottom: 5px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      margin: 10px 0;
      font-size: 14px;
    }

    .bot {
      color: #00ff66;
      margin-bottom: 8px;
    }

    .user {
      color: #ff4444;
      text-align: right;
      margin-bottom: 8px;
    }

    .input-box {
      display: flex;
    }

    input {
      flex: 1;
      background: black;
      color: white;
      border: 1px solid #00ff66;
      padding: 5px;
    }

    button {
      background: #00ff66;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    🦜 <strong>Cheema AI</strong><br>
    <small>DIY Build Helper — Beta</small>
  </div>

  <div id="chat" class="chat">
    <div class="bot">Hey! I’m Cheema 🦜 What DIY project are you thinking about?</div>
  </div>

  <div class="input-box">
    <input id="userInput" placeholder="Ask Cheema..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = type;
  msg.innerText = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const lower = message.toLowerCase();

  if (lower.includes("blueprint") || lower.includes("chair")) {
    addMessage(
`🪑 CHAIR BLUEPRINT (BEGINNER)

Materials:
- 4 wooden legs (18")
- 1 seat panel (16x16")
- Screws (2")
- Wood glue

Steps:
1. Attach legs to each corner of the seat
2. Secure with screws + glue
3. Let dry 24 hours
4. Sand edges for safety

Tip 🦜: Measure twice, screw once.`,
      "bot"
    );
  } else {
    addMessage("Tell me what you want to build, or ask for a blueprint 🦜", "bot");
  }
}
</script>

</body>
</html>
