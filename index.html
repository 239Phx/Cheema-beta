<script>
let step = 0;
let userData = {};

function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const lower = message.toLowerCase();

  // 🔹 BLUEPRINT CHECK (works anytime)
  if (lower.includes("blueprint")) {
    addMessage(`
🪑 CHAIR BLUEPRINT (BEGINNER)

Materials:
- 4 wooden legs (18")
- 1 seat panel (16x16")
- Screws (2")
- Wood glue

Steps:
1. Attach legs to seat panel
2. Secure with screws + glue
3. Sand edges
4. Test stability

Want an upgraded version?
    `, "bot");
    return;
  }

  // 🔹 CONVERSATION FLOW
  if (step === 0) {
    userData.project = message;
    addMessage("Nice choice. What room or area is this for?", "bot");
    step++;
  } 
  else if (step === 1) {
    userData.room = message;
    addMessage("Got it. What are the dimensions? (example: 10x12)", "bot");
    step++;
  } 
  else if (step === 2) {
    userData.size = message;
    addMessage("Do you want a cheap, standard, or premium build?", "bot");
    step++;
  } 
  else if (step === 3) {
    userData.budget = message;
    addMessage("Awesome. Say **blueprint** when you’re ready 👇", "bot");
    step++;
  }
}

function addMessage(text, sender) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = sender;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>
